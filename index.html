<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Fork POS</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <!-- Login -->
  <div id="login" class="login-wrap">
    <div class="login-card">
      <div class="brand"><span class="logo" id="loginLogo">🍽️</span><h1 id="loginBrandName">Fork POS</h1></div>
      <p class="muted">Sign in to your terminal</p>
      <input id="loginUser" placeholder="Username" autocomplete="username" />
      <div class="pass-wrap">
        <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" />
        <button type="button" id="togglePass" class="pass-toggle" aria-label="Show password">👁</button>
      </div>
      <div class="login-row">
        <label class="remember-me"><input type="checkbox" id="rememberMe" checked /> Remember me</label>
        <a href="#" id="forgotPass" class="forgot-link">Forgot password?</a>
      </div>
      <button id="loginBtn" class="btn primary block">Sign In</button>
      <div id="loginErr" class="err"></div>
      <div class="hint muted">Demo: admin / admin123</div>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand small"><span class="logo" id="sidebarLogo">🍽️</span><span class="bname" id="sidebarBrandName">Fork POS</span></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button id="themeBtn" class="btn ghost">🌓 Theme</button>
        <button id="clockBtn" class="btn ghost">🕐 Clock</button>
        <button id="logoutBtn" class="btn ghost danger">🚪 Logout</button>
      </div>
    </aside>

    <main class="main">
      <div id="notifyBar" class="notify-bar hidden">
        <span id="notifyText"></span>
        <div class="spacer"></div>
        <button id="notifyView" class="btn sm">View</button>
        <button id="notifyDismiss" class="btn sm ghost">✕</button>
      </div>
      <header class="topbar">
        <button id="menuToggle" class="btn ghost only-mobile">☰</button>
        <h2 id="pageTitle">Dashboard</h2>
        <div class="topbar-right">
          <span id="userChip" class="chip"></span>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <div id="modal" class="modal-wrap hidden"><div class="modal" id="modalBox"></div></div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
